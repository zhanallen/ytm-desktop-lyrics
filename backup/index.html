<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YTM Desktop Lyrics - Standalone UI Preview & Design System</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body class="mac-liquid-body">

  <!-- Dynamic Animated Environment Wallpaper Background -->
  <div class="wallpaper-container">
    <div class="fluid-blob blob-cyan"></div>
    <div class="fluid-blob blob-magenta"></div>
    <div class="fluid-blob blob-amber"></div>
    <div class="fluid-blob blob-emerald"></div>
    <div class="light-ray ray-1"></div>
    <div class="light-ray ray-2"></div>
    <div class="wallpaper-grid"></div>
  </div>

  <!-- Main Window Chassis: Thick Liquid Glass Block -->
  <div class="widget-container thick-glass-block">

    <!-- Top Razor-Sharp Specular Rim Light -->
    <div class="top-specular-rim"></div>

    <!-- Prismatic Chromatic Refraction Ring -->
    <div class="prismatic-edge-ring"></div>

    <!-- Internal Caustic Refraction Light Beam Layer -->
    <div class="internal-caustic-layer"></div>

    <!-- Header Bar: Floating Control Plane -->
    <div class="header-bar" data-tauri-drag-region>
      <!-- Left Column: Album Cover in Concentric Carved Socket -->
      <div class="mini-cover-col" data-tauri-drag-region>
        <div class="carved-cover-socket">
          <div class="album-cover-placeholder thick-glass-cover">
            <!-- Music Icon -->
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 18V5l12-2v13"></path>
              <circle cx="6" cy="18" r="3"></circle>
              <circle cx="18" cy="16" r="3"></circle>
            </svg>
          </div>
        </div>
      </div>

      <!-- Right Column: Track Info & Playback Controls -->
      <div class="mini-content-col" data-tauri-drag-region>
        <div class="track-details" data-tauri-drag-region>
          <span class="track-title" title="YouTube Music">YouTube Music</span>
          <span class="track-artist" title="未在播放">未在播放</span>
        </div>

        <!-- Controls Row: Capsule Glass Sockets + Concentric Glass Keys -->
        <div class="controls-single-row" data-tauri-drag-region>
          <!-- Left: Playback Controls (Capsule Socket) -->
          <div class="playback-controls-group">
            <div class="button-group carved-glass-socket pill-socket">
              <button class="control-btn glass-key-btn playback-btn" title="上一首">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polygon points="19 20 9 12 19 4 19 20"></polygon>
                  <line x1="5" y1="19" x2="5" y2="5"></line>
                </svg>
              </button>
              <button class="control-btn glass-key-btn playback-btn" title="播放">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polygon points="5 3 19 12 5 21 5 3"></polygon>
                </svg>
              </button>
              <button class="control-btn glass-key-btn playback-btn" title="下一首">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polygon points="5 4 15 12 5 20 5 4"></polygon>
                  <line x1="19" y1="5" x2="19" y2="19"></line>
                </svg>
              </button>
            </div>
          </div>

          <!-- Right: Utility Controls (Settings Window Trigger, Lyrics Toggle, Click-Through Toggle) -->
          <div class="utility-controls-group">
            <!-- Settings Button -->
            <button class="control-btn btn-settings glass-key-btn squircle-key" title="開啟偏好設定選單 (+0.0s)">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
              </svg>
            </button>

            <!-- Toggle Lyrics Button -->
            <button class="control-btn btn-lyrics-toggle glass-key-btn squircle-key" title="隱藏動態歌詞 (保留播放器與封面)">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>

            <!-- Click Through Toggle Button -->
            <button class="control-btn btn-lock-toggle glass-key-btn squircle-key lock-fixed-btn" title="開啟滑鼠穿透 (快捷鍵 Alt+L)">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 9.9-1"></path>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Lyrics Canvas Area -->
    <div class="lyrics-canvas">
      <!-- Injected dynamically via script.js -->
    </div>

    <!-- Settings Modal Backdrop & Card -->
    <div class="settings-modal-backdrop">
      <div class="settings-modal-card">
        <!-- Header -->
        <div class="settings-modal-header">
          <span class="settings-modal-title">偏好設定</span>
          <button class="settings-close-btn" title="關閉">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>

        <!-- Body Content -->
        <div class="settings-modal-body">
          <!-- Section 1: Lyric Offset Adjustment -->
          <div class="settings-section">
            <div class="settings-section-label">
              <svg class="section-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
              </svg>
              <span>歌詞時間軸微調 (Sync Offset)</span>
            </div>

            <div class="offset-display-row">
              <span class="offset-value">+0.0s</span>
              <button class="control-btn offset-reset-btn" title="重置為 0.0s">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="1 4 1 10 7 10"></polyline>
                  <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
                </svg>
                重置
              </button>
            </div>

            <div class="offset-btn-group">
              <button class="control-btn modal-action-btn">-0.5s</button>
              <button class="control-btn modal-action-btn">-0.1s</button>
              <button class="control-btn modal-action-btn">+0.1s</button>
              <button class="control-btn modal-action-btn">+0.5s</button>
            </div>
          </div>

          <!-- Section 2: Quick Toggles -->
          <div class="settings-section">
            <div class="settings-section-label">
              <svg class="section-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"></path>
                <path d="M13 13l6 6"></path>
              </svg>
              <span>懸浮窗狀態切換</span>
            </div>
            <div class="settings-toggle-row">
              <button class="control-btn modal-toggle-btn">
                <span>滑鼠點擊穿透</span>
                <span class="hotkey-badge">Alt+L</span>
              </button>

              <button class="control-btn modal-toggle-btn active">
                <span>歌詞顯示中</span>
                <span class="hotkey-badge">Alt+V</span>
              </button>
            </div>
          </div>

          <!-- Section 3: Language Settings -->
          <div class="settings-section">
            <div class="settings-section-label">
              <svg class="section-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="2" y1="12" x2="22" y2="12"></line>
                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
              </svg>
              <span>語言設定 (Language)</span>
            </div>
            <div class="settings-toggle-row">
              <button class="control-btn modal-toggle-btn">
                <span>系統預設</span>
              </button>
              <button class="control-btn modal-toggle-btn active">
                <span>繁體中文</span>
              </button>
              <button class="control-btn modal-toggle-btn">
                <span>English</span>
              </button>
            </div>
          </div>

          <!-- Section 4: Hotkeys Hint -->
          <div class="settings-section">
            <div class="settings-section-label">
              <svg class="section-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="4" width="20" height="16" rx="2" ry="2"></rect>
                <line x1="6" y1="8" x2="6.01" y2="8"></line>
                <line x1="10" y1="8" x2="10.01" y2="8"></line>
                <line x1="14" y1="8" x2="14.01" y2="8"></line>
                <line x1="18" y1="8" x2="18.01" y2="8"></line>
                <line x1="8" y1="16" x2="16" y2="16"></line>
              </svg>
              <span>全域快速鍵 (Global Hotkeys)</span>
            </div>
            <div class="hotkeys-grid">
              <div class="hotkey-item">
                <kbd>Alt + L</kbd>
                <span>切換滑鼠穿透模式</span>
              </div>
              <div class="hotkey-item">
                <kbd>Alt + V</kbd>
                <span>切換動態歌詞顯示</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- UI Testing & Layout Adjustment Floating Dock -->
  <div class="ui-test-dock">
    <span class="dock-label">UI 測試與調校 Dock:</span>
    <button class="dock-btn active" data-dock-state="waiting">等待播放</button>
    <button class="dock-btn" data-dock-song="0">播放: Rick Astley</button>
    <button class="dock-btn" data-dock-song="1">播放: 周杰倫 - 晴天</button>
    <button class="dock-btn" data-dock-song="2">播放: Queen</button>
    <span style="color: rgba(255,255,255,0.2);">|</span>
    <button class="dock-btn" data-dock-state="searching">搜尋歌詞中</button>
    <button class="dock-btn" data-dock-state="nolyrics">無動態歌詞</button>
    <span style="color: rgba(255,255,255,0.2);">|</span>
    <button class="dock-btn active" data-dock-lang="zh-TW">繁中</button>
    <button class="dock-btn" data-dock-lang="en">EN</button>
    <span style="color: rgba(255,255,255,0.2);">|</span>
    <button class="dock-btn active" data-dock-size="standard">標準 (360x520)</button>
    <button class="dock-btn" data-dock-size="compact">緊湊 (295x420)</button>
    <button class="dock-btn" data-dock-size="large">大視窗 (420x620)</button>
    <button class="dock-btn" data-dock-size="full">滿版 100%</button>
  </div>

  <script src="./script.js"></script>
</body>
</html>
